name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write   # dibutuhkan untuk membuat Release saat push tag
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements-dev.txt
      - name: Pasang Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build (tes + PyInstaller + selftest + zip + installer)
        run: python tools/build.py --zip --installer
      - name: Uji pada Windows sungguhan (DPAPI, .exe, installer, uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\VibeMotionNext-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "Installer tidak ditemukan di dist\" }
          python tools/check_windows.py --exe dist\VibeMotionNext\VibeMotionNext.exe --installer $setup.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: VibeMotionNext-windows
          path: |
            dist/VibeMotionNext-Setup-*.exe
            dist/VibeMotionNext-*-portable.zip
      - name: Rilis (hanya saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VibeMotionNext-Setup-*.exe
            dist/VibeMotionNext-*-portable.zip
          generate_release_notes: true
